begränsningar:
  - "Historisk besiktning. Inga påståenden om dagens skick eller senare totalrenoveringar."
  - "Två återkontrollsposter, 63C och 59C 2017-04-11, står som Registrerad; ingen genomförd återkontroll antas. Sammanfattningsrapportens uppgift om kvarstående A-brister sparas separat."
  - "OK vid återkontroll bevaras som daterat källresultat, utan antaget åtgärdsdatum eller generell slutdokumentation."
  - "Sammanfattningsrapporten anger 19 lägenheter med brandvarnarbrister. Detaljlistan har 18 lägenheter med klassad brist samt 67F där raden redan står som OK. Skillnaden bevaras, inte utjämnad."
  - "21 lägenheter i temat diskmaskinsinstallation eller avloppsslang innebär inte 21 utslitna slangar, läckor eller krav på slangbyte."
  - "Fuktindikation är inte automatiskt fastställd fuktskada. Ingen ny diagnos eller besiktningsklassning görs."
  - "Klass A/B/C i lägenhetsrapporten ska inte blandas ihop med ansvarsbokstäver i takbesiktningar eller riskklasser i lekplatsprotokoll."

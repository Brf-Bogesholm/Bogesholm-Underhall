    övergripande_original: "Anmärkning: Enligt Felklassning*\nstandard\nSaknas\nRutiner som innefattar att löpande 1176-7:6.1 C-fel\nkontroller och besiktningar tex.\negenkontroller, besiktningsrapport etc.\nRutiner för drift- & underhåll där hänsyn Saknas 1176-7:7.1/ C-fel\ntas till redskapstillverkarens anvisningar 8.1.1\nsamt rutiner för avvikelsehantering\nRutin som säkerställer att endast Saknas 1176-7:7.3/ C-fel\nkompetent personal utför såväl 8.1.1\nunderhåll som driftåtgärder\nFinns system upprättat gällande Saknas 1176-7:8.1.2/ C-fel\nsäkerhetshanteringen av lekplatsen, 8.2.1\nsäkerhetsåtgärder och dess effektivitet\nRutiner för dokumentation Saknas 1176-7:8.2.2 C-fel\nHänvisningsskylt Finns 1176-7:8.2.3 IFI\nRutiner för åtgärd vid olycka/ incident Saknas 1176-7:8.2.4 C-fel\nBrunnar inom området, finns det olåsta - Boverkets IFI\nbrunnar utan fallskydd i anslutning till byggregler\nlekplats (BBR)"

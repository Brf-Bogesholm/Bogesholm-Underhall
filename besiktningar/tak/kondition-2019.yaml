omfattning: "14 bostadsbyggnader; översiktlig syn från mark med kikare, stickprov av takfötter och drönarfoto/video."
undantag:
  - "Garagebyggnader"
  - "Byggnad med skyddsrum"
  - "Föreningsbyggnad med bandtäckt plåttak och anslutande uterum"
begränsningar:
  - "Takytor inte helt åtkomliga för detaljsyn; fler fel kan förekomma."
  - "Konstruktionsritningar saknades."
  - "Taksäkerhetsutrustning inte detaljbesiktigad."
generella_iakttagelser:
  - "Uppgivet nybyggnadsår 1984. Sadeltakstolar av fackverkstyp, råspont och underlagspapp bedömd YAM."
  - "Ursprungliga tvåkupiga betongpannor; högtryckstvättade och efterbehandlade. Mindre lav/mossa bedömdes främst ha utseendemässig betydelse."
  - "Underlagspapp och läkt i stort bedömdes ha lång återstående livslängd; exponerade kanter vid främst södra/västra takfötter mer åldrade."
  - "Fågelskyddslister saknades, fågelbon ökade lokal fuktbelastning."
  - "Plåtisolbeslag med flagnande beläggning, utan noterade markanta rostangrepp generellt. Fläkthuvskanter hade måttliga rostangrepp."
  - "Avvattningssystem bedömt ursprungligt. Omfattande granulat från taktvätt låg i rännorna och hindrade avrinning, med risk för överrinning och tidigare rost."
  - "Lövsilar behöver täckas eller stuprör kopplas bort från markavlopp vid rengöring för att undvika granulat i markavloppen. Detta är en rekommendation, inte ett intyg om utförd rensning."
  - "Fasadstegar vid 67H och 63 hade glappande övre fästen och saknade omslutande fallskydd enligt rapporten."
  - "Inga kända pågående takläckage uppgavs 2019; tidigare lokala rötskador och läckage vid blyplåtsövergångar uppgavs åtgärdade, utan individuella datum."
rekommendationer:
  - "Specificerade fel bör åtgärdas före andra arbeten."
  - "Skydda utsatta takfötter med kompletterande plåt eller tätskiktsremsa beroende på utförande; byt skadad läkt och montera fågelskydd."
  - "Ommålning av flagnande beslag bedömdes tveksam. Fullt byte föreslogs vid framtida helrenovering."
  - "Rapportören såg 2019 inga hinder mot planerade solceller med lämplig infästning; detta är inte dokumentation av utförd installation."
historisk_livslängdsbedömning: "Underlagspapp/läkt över cirka 20 år och betongpannor minst cirka 20 år enligt bedömningen 2019, förutsatt täta pannor och beslag. Inte en ny bedömning eller garanti."

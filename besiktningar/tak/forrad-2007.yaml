id: "B-FORRAD-20071126"
typ: "Syn av förråd vid fasadrenovering"
datum: "2007-11-26"
rapportdatum: "2007-12-09"
utförare: "Riksbyggen"
dokument:
  källa: "K-TAK-D001"
  arkivsökväg: "Tak hängrännor/2015/Fasadrenovering.pdf"
  sha256: "38b9343ad4910d22f50572b302c71f2f9c512497be2a777e8cbaa64282ceed77"
metod: "Ingen demontering eller rivning; takpannor vid blyplåt lyftes. Synliga problem och indikationer noterades."
bakgrund: "Fukt i förråd vid balkonger på våning 2 och väggar under förråden på våning 1. Misstänkt vatteninträngning vid anslutningar mellan tak över tegelfasad och fortsättning över förråd."
sammanfattning:
  - "Blyplåtar bedömdes ofta leda vatten ned i väggar. Takpapp och takpannor vid anslutningarna ofta skadade."
  - "Byte av blyplåt vid 55A var utfört vid synen. Övriga byten och lagning av takpapp föreslogs snarast."
  - "Annan inträngning, exempelvis mellan vägg och balkonggolv, kunde inte uteslutas."
  - "Boracolbehandling och ventilation för uttorkning föreslogs, inte dokumenterat utförda."
  - "Balkongbjälklagens avvattning bedömdes bristfällig; smala rännor, smuts och grus hindrade avrinning. Ändring föreslogs."
  - "Översyn av tak och lekplatser 2008 omnämns som framtida plan; ingen utförd åtgärd registreras utifrån planen."

  - "Grön-Fri eller likvärdigt på stenkrossfasader och murar"
  - "Röda stuprör/svep på garagebyggnader och gemensamhetslokal byts till nya lika befintliga"
  - "Rötskador: takfot fram 65A och 63F, bak 57A, S3 söderfasad, S1 södergavel samt takfotstassar på lokalens torn"
  - "Takomläggning och ny plåt/avvattning på S2 och S3"
  - "Ny undersidesplåt/avrinning på berörda balkonger enligt fototyper; inte alla lägenheter identifierade"
  - "Vindsluckor byts; mjukfog ovan entrébyggnader byts"
  - "Gungbräda på gård med S1 föreskrivs ersatt med Hags Madri; inte samma individ som senare utrustning"

id: "K-FONSTER-HISTORIKREGEL-20261121"
källa: "K-FONSTER-BEKRAFTELSE-20261121"
grundregel: "Fönster som inte ingår i den bekräftade 2023-listan målades senast 2016 vid områdets fasadunderhåll enligt beställaren."
undantag_projekt: "P-FONSTER-KOMPLETTERING-2023"
begränsning: "Gäller föreningens kända historik vid registreringen. Senare dokumenterade arbeten ska komplettera regeln. Fullständig fysisk fönster-/bågförteckning saknas. Ge inte hela lägenheten senaste målningsår 2023 för att en position målats."
tillämpning: "Samtliga 78 lägenheter får regelreferens; endast de listade positionerna får 2023 som kompletterande målningsår."

    uppgifter:
      - "Racket står i kontoret och panel, hylla och kablar tillhör racket."
      - "En G5 Turret Ultra i cykelförrådet 60-gården och en i cykelförrådet 50-gården."
      - "AI LPR vid garage nr 1, uttryckligen inte en garagelänga. USW Ultra och G5 Flex i cykelförrådet 50-gården."
      - "Garageporten till garaget som hör till 79C reparerades genom byte till ny portmotor. Registret visar entydigt garage G-740."
      - "Faktura 1005437: 0,25 kr är öresavrundning enligt beställaren. Både ursprungliga radbelopp och fakturatotaler bevaras utan dubbel addition av avrundning."
      - "USW Aggregation i kontoret."
      - "Två NanoStation och tre fästen är reservmateriel i kontoret. Ett fäste sitter på gaveln till 61D."
      - "Fakturadatum används som installationsdatum för installerad utrustning enligt tidigare anvisning. Reservmateriel får inget installationsdatum."

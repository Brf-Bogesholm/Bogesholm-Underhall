öppna_uppgifter:
  - "Fakturans identifierare för USW Ultra, AI LPR och G5 Flex har inte klassats som serienummer eller MAC-adresser utan verifiering."
  - "Garage nr 1 kan ännu inte entydigt matchas mot garage-ID i serien 701–771; platsbeteckningen bevaras ordagrant."
  - "Ursprungliga pris- och momsuppgifter för portmotorfakturan bevaras. Radmomsgrund är okänd."
  - "SharePoint-länkar, övriga serienummer och garantiuppgifter saknas."

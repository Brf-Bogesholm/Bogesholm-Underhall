    typ: "beställarens bekräftelse"
    uppgifter:
      - "Endast föreningslokalens aggregat omfattas av OVK."
      - "2014 års avvikelser dokumenteras på 57B, 61A, 71F och 77A."
      - "Samtliga övriga lägenheter ska registreras med totalrensning 2014-06-19 och godkänt resultat enligt beställarens slutsats av avvikelselistan. Huvudprotokollet har inte återfunnits."
dubbletthantering: "2021 års tre PDF-filer förekommer i två mappar och inuti en ZIP. 2024 års PDF förekommer även i en ZIP. Samma dokument räknas endast en gång."
avgränsningar:
  - "Tre OVK-kontroller; ingen utförd kontroll 2018 har registrerats."
  - "2014 års avvikelselista gäller lägenheternas rensning och är inte OVK för lägenheterna."
  - "Kostnader härleds inte ur protokoll eller offerter."
  - "2012 års följebrev innehåller främmande offert-/malltext för Pilstorp 1; dessa uppgifter och belopp används inte för Bogesholm."
  - "Historiska anmärkningars avhjälpande är okänt. Godkänd OVK 2024 stänger inte automatiskt äldre anmärkningar."

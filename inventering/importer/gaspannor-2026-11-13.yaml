avgränsningar:
  - "Originaldokument och teknikernas person-/kontaktuppgifter publiceras inte."
  - "Protokoll och mätvärden skapar inga fakturabelopp. Mallar, felkodsförteckning och aviseringar skapar inga utförda servicehändelser."
  - "Kontrollerna avser sina respektive datum; inget generellt nutida godkännande har antagits."
  - "Rapporternas expansionskärl är kopplade till värmesystemets stora kärl enligt beställaren. Det lilla kärlet till Spirotech S400 är ett separat objekt. Separata avgasaruppgifter identifierar inte automatiskt dagens avgasare."
  - "Ordning mellan fysiska pannbyten över historiken är inte fastställd. Objekt-ID:n följer pannpositioner."
  - "2010-protokollens 73D-adress, motstridigt datum 20/21 januari 2010 och datumkonflikten 2016/2017 bevaras."
  - "Lägenhetsaggregatens kontrollsammanställning är endast källförtecknad och ingår inte i denna pannimport."
öppna_uppgifter:
  - "Luckans åtgärdsstatus är okänd."
  - "Pannornas serienummer, installationsdatum och utbyteshistorik saknas."
  - "2010-protokollens adressavvikelse och datum 20/21 januari behöver utredas."
  - "Protokollet i 2016/besök 2 är daterat 2017-10-01; konflikten är inte löst."
  - "Lägenhetsvis ventilationskontroll 2020 kan granskas och registreras separat."
  - "Beständiga arkivlänkar saknas."

bevarade_undantag:
  - "Toalettskylten på faktura 57551 har uttryckligt leveransdatum 2026-11-16; datumet behålls. Framtida leverans ger ingen genomförd monteringshändelse."
  - "Termostaten och luftpåfyllningen på faktura 7634 behåller arbetsdatum 2026-11-04."
  - "Reservmateriel får inget installationsdatum."
  - "UNVR och UPS utan egen inköpsfaktura får inte tillbehörens datum."
  - "Flera gemensamma arbetsdatum på elfakturor bevaras utan antagen fördelning."
  - "Energi- och abonnemangsperioder, garantier och betalningsstatus påverkas inte."
ersätter_tidigare_öppna_uppgifter:
  - "Leveransdatum som saknades i äldre underlag fylls enligt regeln för de identifierade inköpen ovan."
  - "Okänt installations-/utförandedatum för motorlåset till Mellangången ersätts med fakturadatum enligt regeln."

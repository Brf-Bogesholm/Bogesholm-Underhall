    fil: "3.Flödesschemor & Funktionsbeskrivningar\\3.2 Funktionsbeskrivning UC01.pdf"
    sidor:
      -
        sida: 1
        text: "Bogesholm 2015-04-13 14:52:42 BAS2\nUndercentral\nSYSTEM 5601,5201\nBetjänar: Fastigheter med värme.\nPlacering: DUC1 sitter i AS1 i Pannrum\nApparatskåp: AS1\n********************************************************\n5600-REGLERING\n********************************************************\nFramledningstemperaturgivare 5600-GT11 reglerar via DUC\nframledningstemperaturen till inställt värde enligt\nutetemperaturberoende kurva (GT41) med gaspannor 1-3.\nVid laddning av varmvatten ställs börvärdet för\nframledningstemperaturen 5600-GT11 till ett inställbart\nmanuellt värde (65°C). Vid uppnådd temperatur i\nvarmvattenberedare (över 59°C) återgår normal börvärde.\nGivare för att starta och stoppa laddning av\nvarmvattenberedare är max temperatur av givare\n5201-VVB-GT11 och 5201-VVB-GT12, temperaturer för\nstart/stopp är inställbara.\n********************************************************\n5601-REGLERING\n********************************************************\nFramledningstemperaturgivare 5601-GT11 reglerar via DUC\nframledningstemperaturen till inställt värde enligt\nutetemperaturberoende kurva (GT10) med ventilställdon\n5601-SV11.\n********************************************************\n5601-PUMPSTYRNING\n********************************************************\nCirkulationspump P1(Värme)\nPumpen är i drift vid låg utetemp (hysteresstyrning).\nMotionering vid pumpstopp via tidsschema.\n********************************************************\n5201-REGLERING\n********************************************************\nFramledningstemperaturgivare GT51 reglerar via DUC\nframledningstemperaturen till inställt värde med\ncirkulationspump P2, samt gaspannor 1-3.\n********************************************************\n5201-PUMPSTYRNING\n********************************************************\nCirkulationspump P1(Värme)\nPumpen är i drift vid framledningstemperaturen är lägre\nän inställt börvärde.\nMotionering vid pumpstopp via tidsschema."
      -
        sida: 2
        text: "Cirkulationspump P2(Laddning av varmvatten)\nCirkulationspump P2 startar/stoppar utifrån den aktuella\ntemperaturen i varmvattenberedaren.\nLaddpumpen startar då temperaturen\nsjunker under (54°C) och stoppar då temperaturen\növerstiger (59°C). Inställningar för varmvattenladdning\ngörs i manöverbild.\n********************************************************\nKatastrofskydd\n********************************************************\nVid strömavbrott, omkopplare för gasbrännare vid dörr\neller utlöst högtrycksvakt kommer katastrofskyddsrelä\natt lösa ut. Relä finns i apparatskåpet, denna bryter\nmatning för samtliga gaspannor."

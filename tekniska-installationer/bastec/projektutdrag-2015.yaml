  -
    källa: "K-BASTEC-D25"
    fil: "7.Underhålls & felsökningsinstruktioner\\Felsökningsinstruktioner.pdf"
    sidor:
      -
        sida: 1
        text: "Felsökningsinstruktioner\nDriftfel / Fläktvakt / Motorskydd\nOrsak: ”Driftfel / Fläktvakt / Motorskydd” innebär att det aktuella objektet (motorn) är i ett\ndriftläge som inte överensstämmer med det föreskrivna driftläget.\nKontrollera: 1. Kontrollera motorskyddsbrytaren, alternativt då motorn styrs via frekvensomformare,\nsäkringen för objektet. Om brytaren /säkringen löst ut, återställs denna genom att trycka\nin aktuell återställningsknapp /dvärgbrytare för objektet.\nOm motorskyddsbrytaren /säkringen löser ut igen skall motorn kontrolleras så att fel\ninte föreligger på denna.\n2. Kontrollera att säkerhetsbrytaren ej är frånslagen. Säkerställ att arbete på objektet inte\npågår före eventuellt tillslag av säkerhetsbrytaren.\n3. Kontrollera säkring för manöverspänning 24V.\n4. Kontrollera att inte fläktremmen är för slak eller har brustit.\n5. Om inget fel återfinns i motorn kan inställningarna vara felaktiga, kontakta erforderlig\npersonal.\n6. Kontrollera att regulatorn reglerar motorns varvtal via frekvensomformare så att inställt\nbörvärde för kanaltryck erhålles.\nFrysskydd\nOrsak: \"Frysskydd\" innebär att returtemperaturen från ventilationsanläggningens värmebatteri\när för låg, och att risk för sönderfrysning föreligger.\nKontrollera: 1. Kontrollera att aktuell returtemperatur visar rimliga värden och att inställda\ngränsvärden för aktiv och passiv frysskyddstemperatur är korrekt.\n2. Kontrollera på plats att cirkulationspump för värme är i drift.\n3. Kontrollera på plats att det finns värme fram till batteriet.\n4. Återställ frysskyddet via regulatorn i BAS2. Kontrollera hur frysskyddstemperaturen\nvarierar under uppstart.\n5. Kontrollera om DUC:ens analoga utgång för värmeventilen står i läge \"Manuell\".\nUndersök orsak - ändra till \"Auto\" och kontrollera att den öppnar."
      -
        sida: 2
        text: "Felsökningsinstruktioner\nAvvikelselarm\nOrsak: \"Temperaturavvikelse / Tryckavvikelse\" innebär att ärvärdet för temperatur alternativt\ntryck avviker från inställt börvärde.\nKontrollera: 1. Kontrollera om larm \"Driftfel / fläktvakt / motorskydd\" föreligger. Undersök orsak -\nåtgärda.\n2. Kontrollera att aktuell temperatur alternativt tryck visar rimliga värden och att gräns för\navvikelselarm är korrekt inställd i regulatorn i BAS2 (inställningar\\driftfall).\n3. Kontrollera om DUC:ens analoga utgång för det aktuella ställdonet står i läge\n\"Manuell\". Undersök orsak - ändra till \"Auto\".\n4. Kontrollera att regulatorn reglerar ställdonet så att inställt börvärde erhålles."
  -
    källa: "K-BASTEC-D26"
    fil: "7.Underhålls & felsökningsinstruktioner\\Underhållsinstruktioner.pdf"
    sidor:
      -
        sida: 1
        text: "Underhållsinstruktioner\nRökdetektorer\nBeroende på graden av nedsmutsning används följande alternativ:\n1. Med dammsugare tar man bort torra partiklar.\n2. Med fuktad trasa avlägsnas annan smuts.\n3. Om intern rengöring behövs (rengöring av detektorkammaren), skall detektorinsatsen\nreturneras till leverantören.\n4. För att underlätta ett snabbt byte av moduler vid service bör detektorinsatser och\nkontrollenheter hållas i reserv.\nVid rengöring av detektorn skall även venturiröret demonteras och rengöras.\nEfter rengöring återmonteras röret till ursprungligt läge.\nOBS! Efter rengöring, kontrollera att alla anslutningar är täta och att adapterlocket sluter tätt samt\natt flödesindikatorn gör utslag. Kontrollera även att gummipluggen för testhålet är återinsatt, efter\ndet att detektorn är testad med rök eller aerosol (RDP-300)\nFuktgivare\nFuktgivare kontrolleras med hänsyn till mätvärde.\nSpjällställdon\nStälldon kontrolleras att det öppnar och stänger med fulla slag, att det tätar i stängt läge och att\nställdonet är ordentligt fastsatt på spjällaxeln.\nVentilställdon\nStälldon kontrolleras att det öppnar och stänger med fulla slag, att det tätar i stängt läge och att\ndet är ordentligt fastsatt på spindeln och ventilhus."

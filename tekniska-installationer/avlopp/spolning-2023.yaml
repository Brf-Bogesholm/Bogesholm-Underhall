  avgränsning: "Exakta brunns-ID och ägargränser inte angivna; inga individuella objekt antas."
filmning:
  uppgift: "Protokollen hänvisar till filmer sparade på USB"
  filmer_granskade: false
  kommentar: "Filmning anges både per lägenhet och generellt per hus. Fräsningsofferten säger att hus 53 missats vid filmning, vilket strider mot oktobers generella USB-notering; fullständighet inte verifierad."
